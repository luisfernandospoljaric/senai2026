<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <center>
        <h1>Cadastro de Alunos</h1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="id" name="id" required>
            <br><br>

            <input type="text" placeholder="Nome" name="nome" required>
            <br><br>

            <input type="number" placeholder="nota 1" name="nota1" required>
            <br><br>

            <input type="number" placeholder="nota 2" name="nota2" required>
            <br><br>

            <input type="number" placeholder="nota 3" name="nota3" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
    
</body>
</html>
