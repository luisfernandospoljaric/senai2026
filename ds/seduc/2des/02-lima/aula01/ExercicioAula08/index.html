<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle do Ventilador</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Controle do Ventilador</h1>

        <!-- Ventilador -->
        <div id="ventilador" class="ventilador">

            <div class="helices">

                <div class="helice helice1"></div>

                <div class="helice helice2"></div>

                <div class="helice helice3"></div>

            </div>

            <div class="centro"></div>

        </div>

        <!-- Status -->
        <p id="status">Status: Desligado</p>

        <!-- Botão ligar/desligar -->
        <button id="botao">
            Ligar
        </button>

        <h2>Velocidade</h2>

        <div class="velocidades">

            <button id="velocidade1">
                1
            </button>

            <button id="velocidade2">
                2
            </button>

            <button id="velocidade3">
                3
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
